# APACHE_DOCUMENT_ROOT comes from the container environment (see compose.yaml).
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Never serve dotfiles/dirs such as .env, .git or .devcontainer (except .well-known).
    <LocationMatch "/\.(?!well-known(/|$))">
        Require all denied
    </LocationMatch>

    # Workspace-specific: the homepage links to /tools/<slug>/ and /README.md,
    # which live in the project root outside the httpdocs docroot.
    # Hand-added: re-add after regenerating with create-devcontainer.sh --force.
    Alias /tools /workspace/tools
    Alias /README.md /workspace/README.md
    <Directory /workspace/tools>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex SKILL.md index.html
    </Directory>
    <Directory /workspace>
        <FilesMatch "^(README\.md)$">
            Require all granted
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
